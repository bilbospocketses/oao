# CI: build + test on every push to master and every PR targeting master.
#
# This workflow enables the `required_status_checks` rule that Phase C of
# TODO 7 (Repo security hardening) will add to the master branch ruleset
# (rule will reference the `build-and-test` job context). Without this
# workflow existing and reporting status, the rule would block ALL pushes
# to master because the required check would never report.
#
# All actions are pinned to commit SHAs (per the upcoming ruleset's
# implicit expectation — matches control-menu / ws-scrcpy-web parity).
# Trailing `# v<x>` comments preserve human-readable version context.
# Dependabot (`.github/dependabot.yml`, `package-ecosystem: github-actions`)
# PRs SHA bumps as upstream actions tag new versions.
#
# Runs on windows-latest only — matches CM's pattern, matches oao's
# Windows-first deploy story. TODO 1 (Linux validation on real
# hardware/VM) covers the cross-platform validation work; CI-side Linux
# coverage can be added as a follow-up Phase B.x once that work
# establishes which tests are Linux-safe.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The American-spelling gate below diffs from the merge-base with the
          # base branch and refuses a shallow clone.
          fetch-depth: 0

      # American spelling. The cross-repo gate from bilbospocketses/american-spelling
      # scans the lines this branch adds and its commit messages, and fails on a
      # British spelling. It runs first because it is the cheapest gate here.
      #
      # Steps inside build-and-test rather than a job of their own: master's ruleset
      # requires a check named exactly `build-and-test`, so a separate job would
      # not be required and could rot unnoticed.
      #
      # Exceptions are not kept in this repo. A verbatim quote takes the inline
      # `spelling: allow` marker; an identifier used on many lines goes in the
      # gate's central allow.txt, and reaches this repo when the pin is bumped.
      # On a push to master the base is master itself, so there is nothing to scan.
      #
      # These steps use Git Bash (present on GitHub's Windows runners) so that
      # `${BASE}` and `rm -rf` behave the same as on Linux, and `python` because
      # windows-latest does not ship a `python3` command.
      - name: Fetch the base branch
        shell: bash
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
      - name: Check out the American-spelling gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bilbospocketses/american-spelling
          ref: 21ed7e5524c511d9ee584778d42b72e6ddaeba86 # v1.0.2
          path: .american-spelling
          persist-credentials: false
      - name: Check American spelling
        # The runner's own Python 3; the gate is stdlib-only.
        shell: bash
        run: >-
          python .american-spelling/check-american-spelling.py
          --repo .
          --base "origin/${BASE}"
          --repo-slug "${SLUG}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          SLUG: ${{ github.repository }}
      - name: Remove the gate checkout
        # Keeps it out of the solution tree the build and test steps walk.
        shell: bash
        run: rm -rf .american-spelling

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore oao.sln

      - name: Build
        run: dotnet build oao.sln -c Release --no-restore

      - name: Test
        run: dotnet test oao.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/test-results.trx'
