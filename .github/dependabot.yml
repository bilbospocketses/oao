# Dependabot version updates for oao.
#
# Security updates are handled separately by Dependabot security alerts
# (enabled via repo Settings -> Code security and analysis). This file
# covers routine non-security version bumps.
#
# Two ecosystems wired:
#   - nuget: covers the .NET 10 dep graph (ASP.NET Core, EF Core,
#     Microsoft.Identity, SignalR, YARP, Docker.DotNet, BouncyCastle,
#     xUnit, bunit, Moq, etc.) across oao.Web.csproj and oao.Tests.csproj.
#     Dependabot auto-discovers all csproj files under the root.
#   - github-actions: maintains the SHA-pinned action refs in
#     .github/workflows/ci.yml (and future release.yml when Velopack
#     ships per TODO 4). Upstream actions tag new versions periodically;
#     without this, Dependabot would never bump our pins and we'd drift
#     on security fixes shipped in the actions themselves.
#
# Weekly cadence keeps PR noise manageable for a solo-owned repo.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Block major bumps on .NET-framework-aligned packages. The major
    # version of Microsoft.AspNetCore.* and Microsoft.EntityFrameworkCore.*
    # tracks the .NET SDK version (9.x → .NET 9; 10.x → .NET 10), so a
    # major bump here implicitly requires a TargetFramework upgrade.
    # Adopt those via a deliberate cross-cutting change, not a Dependabot
    # PR. Patch + minor bumps within the current .NET major remain in.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
    # Batch all minor + patch bumps into ONE weekly PR. With Central Package
    # Management (Directory.Packages.props) a shared package has ONE version for
    # the whole solution, so a grouped bump updates every project atomically --
    # no more per-project drift / NU1605 package-downgrade. Majors still open
    # individually for review.
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Batch all action bumps into one PR — keeps the codeql-action init/analyze/
    # upload-sarif refs in lockstep (a split bump mismatches CodeQL versions) and
    # avoids weekly action-PR pile-ups.
    groups:
      actions:
        patterns:
          - "*"
